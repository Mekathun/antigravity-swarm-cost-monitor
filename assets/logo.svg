<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="scm-ring-a" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="scm-ring-b" x1="110" y1="22" x2="26" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="scm-ring-c" x1="22" y1="98" x2="96" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- Outer subtle track -->
  <circle cx="64" cy="64" r="46" stroke="#64748B" stroke-opacity="0.24" stroke-width="11"/>
  <!-- Segmented cost-share donut arc: Worker A (~48%) -->
  <circle cx="64" cy="64" r="46" stroke="url(#scm-ring-a)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="132 160" transform="rotate(-90 64 64)"/>
  <!-- Segmented cost-share donut arc: Worker B (~28%) -->
  <circle cx="64" cy="64" r="46" stroke="url(#scm-ring-b)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="72 220" transform="rotate(84 64 64)"/>
  <!-- Segmented cost-share donut arc: Worker C (~16%) -->
  <circle cx="64" cy="64" r="46" stroke="url(#scm-ring-c)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="40 252" transform="rotate(190 64 64)"/>
  <!-- Inner swarm hexagon badge -->
  <polygon points="64,34 88,48 88,80 64,94 40,80 40,48" fill="#0F172A" fill-opacity="0.88" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="2.2"/>
  <!-- Connected swarm nodes inside hex -->
  <line x1="64" y1="50" x2="52" y2="71" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="64" y1="50" x2="76" y2="71" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="52" y1="71" x2="76" y2="71" stroke="#10B981" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="64" cy="50" r="5" fill="#38BDF8"/>
  <circle cx="52" cy="71" r="4.5" fill="#10B981"/>
  <circle cx="76" cy="71" r="4.5" fill="#F59E0B"/>
</svg>
